[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkpad-deals"
version = "0.1.0"
description = "Eigener Crawler + Bewertung fuer refurbished ThinkPad-Angebote"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "feedparser>=6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
thinkpad-deals = "thinkpad_deals.cli:main"

[tool.setuptools.packages.find]
include = ["thinkpad_deals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
