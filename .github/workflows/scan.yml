# Laeuft ohne eigenen Rechner auf GitHub Actions: alle 3 Stunden scannen,
# Historie (data/deals.db) und Report (data/report.md) ins Repo committen,
# gute neue Angebote optional per ntfy.sh aufs Handy schicken.
name: scan-deals

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-deals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e .
          # Playwright nur, wenn eine aktive Quelle render: true nutzt (z.B. rebuy)
          if grep -q "render: true" config/sources.yaml; then
            pip install playwright && playwright install --with-deps chromium
          fi

      - name: Scan
        run: |
          set -o pipefail
          thinkpad-deals scan --limit 50 --profile "${PROFILE:-dev}" \
            --notify-file data/notify.txt --notify-min-score "${NOTIFY_MIN_SCORE:-4.5}" \
            --report data/report.md 2>&1 | tee scan.log \
            || echo "SCAN FAILED (exit $?)" | tee -a scan.log
          {
            echo "## Scan $(date -u '+%Y-%m-%d %H:%M') UTC"
            echo '```'
            head -40 scan.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NOTIFY_MIN_SCORE: ${{ vars.NOTIFY_MIN_SCORE }}
          PROFILE: ${{ vars.PROFILE }}

      # Push-Benachrichtigung aufs Handy per ntfy-App. Topic kommt aus der
      # Repository-Variable NTFY_TOPIC, sonst aus dem Fallback hier.
      - name: Notify (ntfy)
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'scrapper_jor' }}
        run: |
          if [ -s data/notify.txt ]; then
            curl -sS -H "Title: ThinkPad-Deals: $(wc -l < data/notify.txt) neue Treffer" \
                 -H "Priority: high" -H "Tags: computer" \
                 --data-binary @data/notify.txt "https://ntfy.sh/$NTFY_TOPIC"
          elif grep -q "SCAN FAILED" scan.log; then
            tail -15 scan.log | curl -sS -H "Title: ThinkPad-Deals: Scan abgestuerzt" -H "Priority: high" -H "Tags: rotating_light" \
                     --data-binary @- "https://ntfy.sh/$NTFY_TOPIC"
          elif grep -q "^0 Angebote gesehen" scan.log; then
            { echo "Der Scan hat kein einziges Angebot geliefert. Fehler:"; grep "Fehler" scan.log || echo "(keine)"; } \
              | curl -sS -H "Title: ThinkPad-Deals: Scan leer" -H "Priority: low" -H "Tags: warning" \
                     --data-binary @- "https://ntfy.sh/$NTFY_TOPIC"
          fi

      - name: Commit history and report
        run: |
          rm -f data/notify.txt
          git config user.name "thinkpad-deals bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]"
          # Falls inzwischen jemand gepusht hat: eigene Commits obendrauf setzen
          git pull --rebase -X theirs origin "${{ github.ref_name }}" || true
          git push
