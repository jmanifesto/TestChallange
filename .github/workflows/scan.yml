# Laeuft ohne eigenen Rechner auf GitHub Actions. Der Cron weckt stuendlich;
# ob wirklich gescannt wird, entscheidet interval_hours in config/control.json
# (das stellt die Steuerseite ein). Historie (data/deals.db) und Report
# (data/report.md) werden ins Repo committet, Treffer gehen per ntfy aufs Handy.
name: scan-deals

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-deals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Intervall pruefen
        id: gate
        run: |
          hours=$(jq -r '.interval_hours // 3' config/control.json)
          last=$(cat data/last_scan.txt 2>/dev/null || echo 0)
          now=$(date +%s)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $((now - last)) -ge $((hours * 3600 - 300)) ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Scan faellig (Intervall ${hours}h)."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Noch nicht faellig (Intervall ${hours}h), uebersprungen."
          fi
          echo "topic=$(jq -r '.ntfy_topic // empty' config/control.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -e .
          # Playwright nur, wenn eine aktive Quelle render: true nutzt (z.B. rebuy)
          if grep -q "render: true" config/sources.yaml; then
            pip install playwright && playwright install --with-deps chromium
          fi

      - name: Scan
        if: steps.gate.outputs.run == 'true'
        run: |
          set -o pipefail
          date +%s > data/last_scan.txt
          thinkpad-deals scan ${PROFILE:+--profile "$PROFILE"} \
            --notify-file data/notify.txt ${NOTIFY_MIN_SCORE:+--notify-min-score "$NOTIFY_MIN_SCORE"} \
            --report data/report.md 2>&1 | tee scan.log \
            || echo "SCAN FAILED (exit $?)" | tee -a scan.log
          {
            echo "## Scan $(date -u '+%Y-%m-%d %H:%M') UTC"
            echo '```'
            head -40 scan.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NOTIFY_MIN_SCORE: ${{ vars.NOTIFY_MIN_SCORE }}
          PROFILE: ${{ vars.PROFILE }}

      # Push-Benachrichtigung aufs Handy per ntfy-App. Topic kommt aus der
      # Repository-Variable NTFY_TOPIC, sonst aus dem Fallback hier.
      - name: Notify (ntfy)
        if: steps.gate.outputs.run == 'true'
        env:
          NTFY_TOPIC: ${{ steps.gate.outputs.topic || vars.NTFY_TOPIC || 'scrapper_jor' }}
        run: |
          if [ -s data/notify.txt ]; then
            curl -sS -H "Title: ThinkPad-Deals: $(wc -l < data/notify.txt) neue Treffer" \
                 -H "Priority: high" -H "Tags: computer" \
                 --data-binary @data/notify.txt "https://ntfy.sh/$NTFY_TOPIC"
          elif grep -q "SCAN FAILED" scan.log; then
            tail -15 scan.log | curl -sS -H "Title: ThinkPad-Deals: Scan abgestuerzt" -H "Priority: high" -H "Tags: rotating_light" \
                     --data-binary @- "https://ntfy.sh/$NTFY_TOPIC"
          elif grep -q "^0 Angebote gesehen" scan.log; then
            { echo "Der Scan hat kein einziges Angebot geliefert. Fehler:"; grep "Fehler" scan.log || echo "(keine)"; } \
              | curl -sS -H "Title: ThinkPad-Deals: Scan leer" -H "Priority: low" -H "Tags: warning" \
                     --data-binary @- "https://ntfy.sh/$NTFY_TOPIC"
          fi

      - name: Commit history and report
        if: steps.gate.outputs.run == 'true'
        run: |
          rm -f data/notify.txt
          git config user.name "thinkpad-deals bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]"
          # Falls inzwischen jemand gepusht hat: eigene Commits obendrauf setzen
          git pull --rebase -X theirs origin "${{ github.ref_name }}" || true
          git push
