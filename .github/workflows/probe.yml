# Hilfswerkzeug: Shop-Seiten vom Runner aus laden, Selektoren vorschlagen und
# das rohe HTML in den Branch `probe-data` committen (nicht in main). Damit
# lassen sich neue Quellen anbinden, ohne dass ein eigener Rechner die Seite
# aufrufen muss. Neue Laeufe ergaenzen den Branch, gleiche URLs ueberschreiben ihre Datei.
name: probe-page

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Eine oder mehrere Listen-URLs, durch Leerzeichen getrennt"
        required: true
      render:
        description: "per Playwright rendern (JS-Shops)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e .
          if [ "${{ inputs.render }}" = "true" ]; then
            pip install playwright && playwright install --with-deps chromium
          fi
      - name: Fetch and calibrate
        run: |
          mkdir -p probe
          python - <<'PY'
          import os, re, sys, subprocess
          from urllib.parse import urlparse
          from thinkpad_deals.http import Fetcher
          render = os.environ["RENDER"] == "true"
          f = Fetcher(cache_dir=None, delay_s=3)
          for url in os.environ["URLS"].split():
              slug = re.sub(r"[^a-z0-9]+", "-", (urlparse(url).netloc + urlparse(url).path).lower()).strip("-")[:80]
              try:
                  html = f.get(url, render=render, check_robots=False)
                  status = f"{len(html)} Zeichen"
              except Exception as e:
                  html = f"<!-- FETCH FAILED: {e!r} -->"
                  status = f"FEHLER {e!r}"
              open(f"probe/{slug}.html", "w", encoding="utf-8").write(html)
              cal = subprocess.run(["thinkpad-deals", "calibrate", f"probe/{slug}.html"], capture_output=True, text=True)
              open(f"probe/{slug}.calibrate.txt", "w", encoding="utf-8").write(f"URL: {url}\n{status}\n\n{cal.stdout}{cal.stderr}")
              print(f"{url} -> {status}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
                  s.write(f"## {url}\n{status}\n\n```\n{cal.stdout[:3000]}\n```\n")
          PY
        env:
          URLS: ${{ inputs.urls }}
          RENDER: ${{ inputs.render }}
      - name: Commit to probe-data branch
        run: |
          git config user.name "thinkpad-deals bot"
          git config user.email "actions@users.noreply.github.com"
          mv probe /tmp/probe-new
          if git fetch origin probe-data 2>/dev/null; then
            git checkout -q probe-data
          else
            git checkout -q --orphan probe-data && git rm -rfq --cached . && git clean -fdq
          fi
          mkdir -p probe && cp /tmp/probe-new/* probe/
          git add -f probe/
          git commit -qm "probe: $(date -u '+%Y-%m-%d %H:%M') UTC" || true
          git push origin probe-data
