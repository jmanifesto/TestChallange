# Quellen fuer `thinkpad-deals scan`.
# Jede Quelle hat kind: mydealz_rss | shop. Mit enabled: false abschalten.
delay_s: 2.0          # Mindestabstand zwischen Requests pro Host
cache_ttl_s: 1800     # geholte Seiten 30 min lokal cachen (schont die Shops beim Entwickeln)

sources:
  # 1) Strukturiert und offiziell: die mydealz-RSS-Feeds.
  #    /rss/suche?q=... existiert nicht (404). Gruppen-Feeds und der Feed aller neuen
  #    Deals funktionieren; Nicht-ThinkPads werden per Titel herausgefiltert.
  - name: mydealz
    kind: mydealz_rss
    feeds:
      - https://www.mydealz.de/rss/gruppe/lenovo-thinkpad
      - https://www.mydealz.de/rss/neu

  # 2) Der Haendler aus dem T580-Deal. Selektoren per probe-page am 2026-10-25 ermittelt.
  #    Preis in der Liste ist der guenstigste Zustand; die Note (A-/B+/B) waehlt man auf der Produktseite.
  - name: hardware-online-shop
    kind: shop
    urls:
      - "https://www.hardware-online-shop.de/refurbished-laptops/lenovo?page={page}"
    max_pages: 4
    selectors:
      item: "div.product-item"
      title: "a.product-title"
      price: "div.product-price span"
      link: "a.product-title"

  # 3) refurbed (Marktplatz, 12-36 Monate Garantie). Listenpreis = guenstigster Zustand.
  #    Specs stehen nicht im Titel, sondern in der Zeile darunter ("Arbeitsspeicher Größe 16.0 GB | Speicherplatz 512 GB").
  #    Die Kategorie liefert serverseitig 16 Karten; weitere Seiten laedt refurbed per JavaScript nach
  #    (/2/ liefert dieselben 16). Fuer mehr: render: true setzen.
  - name: refurbed
    kind: shop
    urls:
      - "https://www.refurbed.de/c/lenovo-laptops/"
    max_pages: 1
    selectors:
      item: "article[data-test=product-tile]"
      title: "h3[data-test=productcard-name]"
      price: "div[data-test=product-price]"
      link: "a[data-test=productcard-link]"
      description: "h3 + div"

  # 4) rebuy. Das Server-HTML enthaelt keine Produkte, die Liste kommt komplett per JavaScript
  #    (Angular). Deshalb render: true; der Workflow installiert dann Playwright. Volltextsuche ist
  #    unscharf, daher die Kategorie Notebooks > Lenovo.
  - name: rebuy
    kind: shop
    enabled: true
    render: true
    urls:
      - "https://www.rebuy.de/kaufen/notebooks/lenovo?page={page}"
    max_pages: 2
    selectors:
      item: "ry-product"
      title: "div.title"
      price: "span[data-cy=product-price]"
      link: "a[href]"

  # 5) AfB (gemeinnuetziger Refurbisher, Shopware). Eigene ThinkPad-Kategorie, Paginierung ?p=N.
  #    Der Titel traegt keine Specs; die Varianten stehen als Optionen in der Karte. Der Parser nimmt
  #    jeweils die erste Option (kleinste Konfiguration), die zum angezeigten "ab"-Preis gehoert.
  - name: afb
    kind: shop
    urls:
      - "https://www.afbshop.de/gebrauchte-notebooks/lenovo-thinkpads/?p={page}"
    max_pages: 3
    selectors:
      item: "div.product-box"
      title: "a.product-name"
      price: "span.product-price"
      link: "a.product-name"
      description: "div.product-variant-characteristics"

  # 6) eBay-Suchergebnisse (Zustand: generalueberholt = LH_ItemCondition=2500|3000, Sofortkauf, Preis aufsteigend).
  #    Selektoren entsprechen dem eBay-Listing-Markup der letzten Jahre; bei Aenderungen calibrate nutzen.
  #    eBay verbietet /sch/ in seiner robots.txt fuer alle Bots. ignore_robots: true heisst: du nimmst
  #    das fuer deinen privaten Gebrauch (3 Seiten alle 3 Stunden) bewusst in Kauf. Sauberer waere die
  #    eBay Browse API mit eigenem Developer-Key.
  #    Stand 2026-10: eBay antwortet GitHub-Actions-Runnern mit 403 (Bot-Schutz). Deshalb aus.
  #    Lokal auf dem eigenen Rechner kann es klappen; sonst eBay Browse API.
  - name: ebay
    kind: shop
    enabled: false
    ignore_robots: true
    urls:
      - "https://www.ebay.de/sch/i.html?_nkw=thinkpad+16gb&LH_BIN=1&LH_ItemCondition=2500%7C3000&_sop=15&_udhi=300"
      - "https://www.ebay.de/sch/i.html?_nkw=thinkpad+t480+16gb&LH_BIN=1&_sop=15&_udhi=250"
    max_pages: 3
    selectors:
      item: "li.s-item"
      title: ".s-item__title"
      price: ".s-item__price"
      link: "a.s-item__link"
      next_page: "a.pagination__next"
